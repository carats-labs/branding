<head>

    <title>Logo Color Variants</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Smooth transitions if palettes change dynamically */
        .logo-svg path, .logo-svg polygon, .logo-svg text {
            transition: fill 0.3s ease, stroke 0.3s ease;
        }
        
        /* Small dots to display the palette colors */
        .color-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 1px solid rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-8 font-sans text-slate-800 selection:bg-blue-200">

            <h1 class="text-4xl font-extrabold text-slate-900 mb-3 tracking-tight">Logo Color Variants</h1>
            <p class="text-slate-600 max-w-2xl mx-auto">
                Standardized branding assets based on the primary "Bright Aurora" logo, along with our full collection of exploratory color variations (Northern Lights, Deep Ocean, Amethyst, and more).
            </p>
        </header>

        <!-- Grid to hold the dynamically generated variants -->
        <div id="variants-container" class="flex flex-wrap gap-4 justify-evenly">
            <!-- Cards will be injected here by JavaScript -->
        </div>
    </div>

                    </g>
                </svg>
            </div>
            
            <div class="text-center w-full bg-slate-50 p-4 rounded-xl card-footer">
                <h3 class="text-lg font-bold text-slate-800 variant-name w-48 mb-3"></h3>
                <div class="flex justify-center gap-1.5 palette-dots mb-3">
                    <!-- Dots injected via JS -->
                </div>
                <button class="copy-btn px-3 py-1.5 text-sm bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition-colors flex items-center gap-1.5 mx-auto">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    Copy SVG
                </button>
            </div>
        </div>
    </template>
    <script src="palettes.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('variants-container');
            const template = document.getElementById('card-template');

            palettes.forEach((palette, index) => {
                const clone = template.content.cloneNode(true);
                const cardElement = clone.querySelector('.logo-card');
                const titleElement = clone.querySelector('.variant-name');
                const footerElement = clone.querySelector('.card-footer');
                
                titleElement.textContent = palette.name;
                
                // Handle optional dark mode styling for specific cards
                if (palette.bg) {
                    cardElement.classList.remove('bg-white', 'border-slate-200');
                    cardElement.className += ` ${palette.bg}`;
                    titleElement.classList.remove('text-slate-800');
                    titleElement.className += ` ${palette.text}`;
                    footerElement.classList.remove('bg-slate-50');
                    footerElement.className += ` bg-slate-800`;
                }
                
                const dotsContainer = clone.querySelector('.palette-dots');
                
                for (const [token, colorValue] of Object.entries(palette.tokens)) {
                    cardElement.style.setProperty(token, colorValue);
                    
                    // Show dots only if they aren't solid silhouettes or wireframes
                    if (!['Silhouette', 'Blueprint'].some(name => palette.name.includes(name))) {
                        const keyTokensForDots = ['--color-facet-11', '--color-facet-1', '--color-facet-12', '--color-facet-13'];
                        if(keyTokensForDots.includes(token)) {
                            const dot = document.createElement('div');
                            dot.className = 'color-dot shadow-inner';
                            dot.style.backgroundColor = colorValue;
                            dot.title = colorValue;
                            dotsContainer.appendChild(dot);
                        }
                    }
                }

                // If the palette defines a gradient, inject an SVG <linearGradient>
                // and point --color-stroke-all (the CARATS letterform) at it.
                if (palette.gradient) {
                    const svgEl = clone.querySelector('.logo-svg');
                    const ns = 'http://www.w3.org/2000/svg';
                    const gradId = `carats-cut-${index}`;
                    const defs = document.createElementNS(ns, 'defs');
                    const grad = document.createElementNS(ns, 'linearGradient');
                    grad.setAttribute('id', gradId);
                    grad.setAttribute('x1', '0');
                    grad.setAttribute('y1', '0');
                    grad.setAttribute('x2', '1');
                    grad.setAttribute('y2', '1');
                    palette.gradient.stops.forEach(([offset, color]) => {
                        const stop = document.createElementNS(ns, 'stop');
                        stop.setAttribute('offset', offset);
                        stop.setAttribute('stop-color', color);
                        grad.appendChild(stop);
                    });
                    defs.appendChild(grad);
                    svgEl.insertBefore(defs, svgEl.firstChild);
                    if (palette.gradient.target === 'facets') {
                        svgEl.querySelectorAll('path[fill^="var(--"]:not(.carats-letterform)').forEach(p => {
                            p.setAttribute('fill', 'url(#' + gradId + ')');
                        });
                        svgEl.querySelector('.carats-letterform').setAttribute('fill', '#35354F');
                    } else {
                        cardElement.style.setProperty('--color-stroke-all', `url(#${gradId})`);
                        svgEl.querySelector('.carats-letterform').setAttribute('fill', 'url(#' + gradId + ')');
                    }
                }

                const copyBtn = clone.querySelector('.copy-btn');
                copyBtn.addEventListener('click', () => {
                    const svgElement = cardElement.querySelector('.logo-svg');
                    const svgClone = svgElement.cloneNode(true);
                    
                    // Get computed styles and replace CSS variables with actual values
                    const computedStyles = window.getComputedStyle(cardElement);
                    const colorTokens = [
                        '--color-facet-1', '--color-facet-2', '--color-facet-3', '--color-facet-4',
                        '--color-facet-5', '--color-facet-6', '--color-facet-7', '--color-facet-8',
                        '--color-facet-9', '--color-facet-10', '--color-facet-11', '--color-facet-12',
                        '--color-facet-13', '--color-facet-14', '--color-facet-15',
                        '--color-fill-center', '--color-stroke-all'
                    ];
                    
                    const colorMap = {};
                    colorTokens.forEach(token => {
                        colorMap[`var(${token})`] = computedStyles.getPropertyValue(token).trim();
                    });
                    
                    // Replace CSS variable references with actual color values
                    svgClone.querySelectorAll('*').forEach(el => {
                        const fill = el.getAttribute('fill');
                        if (fill && colorMap[fill]) {
                            el.setAttribute('fill', colorMap[fill]);
                        }
                        const stroke = el.getAttribute('stroke');
                        if (stroke && colorMap[stroke]) {
                            el.setAttribute('stroke', colorMap[stroke]);
                        }
                    });
                    
                    // Serialize SVG and copy to clipboard
                    const svgString = new XMLSerializer().serializeToString(svgClone);
                    navigator.clipboard.writeText(svgString).then(() => {
                        copyBtn.innerHTML = `
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                            Copied!
                        `;
                        copyBtn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
                        copyBtn.classList.add('bg-green-600', 'hover:bg-green-700');
                        setTimeout(() => {
                            copyBtn.innerHTML = `
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                                Copy SVG
                            `;
                            copyBtn.classList.remove('bg-green-600', 'hover:bg-green-700');
                            copyBtn.classList.add('bg-blue-600', 'hover:bg-blue-700');
                        }, 2000);
                    });
                });

                container.appendChild(clone);
            });
        });
    </script>
</body>
</html>
